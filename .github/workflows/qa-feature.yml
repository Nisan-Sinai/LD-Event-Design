name: Storefront exhaustive QA

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: storefront-exhaustive-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit · TypeScript · Unit · Coverage · Build
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.install.outcome }}
      audit: ${{ steps.audit.outcome }}
      typecheck: ${{ steps.typecheck.outcome }}
      coverage: ${{ steps.coverage.outcome }}
      build: ${{ steps.build.outcome }}
      typecheck_log: ${{ steps.typecheck.outputs.log }}
      coverage_log: ${{ steps.coverage.outputs.log }}
      build_log: ${{ steps.build.outputs.log }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: install
        name: npm ci
        continue-on-error: true
        run: npm ci
      - id: audit
        name: Production audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run audit:prod
      - id: typecheck
        name: TypeScript
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run type-check > typecheck.log 2>&1
          code=$?
          echo 'log<<__TYPECHECK__' >> "$GITHUB_OUTPUT"
          tail -n 80 typecheck.log >> "$GITHUB_OUTPUT"
          echo '__TYPECHECK__' >> "$GITHUB_OUTPUT"
          exit "$code"
      - id: coverage
        name: Unit tests and coverage
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:coverage > coverage.log 2>&1
          code=$?
          echo 'log<<__COVERAGE__' >> "$GITHUB_OUTPUT"
          tail -n 120 coverage.log >> "$GITHUB_OUTPUT"
          echo '__COVERAGE__' >> "$GITHUB_OUTPUT"
          exit "$code"
      - id: build
        name: Production build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo 'log<<__BUILD__' >> "$GITHUB_OUTPUT"
          tail -n 80 build.log >> "$GITHUB_OUTPUT"
          echo '__BUILD__' >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Enforce quality gate
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.coverage.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"

  e2e:
    name: Playwright desktop and mobile
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.install.outcome }}
      browser: ${{ steps.browser.outcome }}
      playwright: ${{ steps.playwright.outcome }}
      playwright_log: ${{ steps.playwright.outputs.log }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: install
        name: npm ci
        continue-on-error: true
        run: npm ci
      - id: browser
        name: Install Chromium
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - id: playwright
        name: Playwright desktop and mobile
        if: steps.install.outcome == 'success' && steps.browser.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:e2e > playwright.log 2>&1
          code=$?
          echo 'log<<__PLAYWRIGHT__' >> "$GITHUB_OUTPUT"
          tail -n 140 playwright.log >> "$GITHUB_OUTPUT"
          echo '__PLAYWRIGHT__' >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce E2E gate
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.browser.outcome }}" = "success"
          test "${{ steps.playwright.outcome }}" = "success"

  report:
    name: Publish QA result
    if: always()
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    env:
      TYPECHECK_LOG: ${{ needs.quality.outputs.typecheck_log }}
      COVERAGE_LOG: ${{ needs.quality.outputs.coverage_log }}
      BUILD_LOG: ${{ needs.quality.outputs.build_log }}
      PLAYWRIGHT_LOG: ${{ needs.e2e.outputs.playwright_log }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const quality = '${{ needs.quality.result }}';
            const e2e = '${{ needs.e2e.result }}';
            const ok = quality === 'success' && e2e === 'success';
            const details = [];
            if ('${{ needs.quality.outputs.typecheck }}' !== 'success' && process.env.TYPECHECK_LOG) {
              details.push('### TypeScript error tail', '```text', process.env.TYPECHECK_LOG, '```', '');
            }
            if ('${{ needs.quality.outputs.coverage }}' !== 'success' && process.env.COVERAGE_LOG) {
              details.push('### Unit / coverage error tail', '```text', process.env.COVERAGE_LOG, '```', '');
            }
            if ('${{ needs.quality.outputs.build }}' !== 'success' && process.env.BUILD_LOG) {
              details.push('### Build error tail', '```text', process.env.BUILD_LOG, '```', '');
            }
            if ('${{ needs.e2e.outputs.playwright }}' !== 'success' && process.env.PLAYWRIGHT_LOG) {
              details.push('### Playwright error tail', '```text', process.env.PLAYWRIGHT_LOG, '```', '');
            }
            const body = [
              '<!-- storefront-exhaustive-qa -->',
              `## ${ok ? '✅' : '❌'} Storefront exhaustive QA`,
              '',
              '### Quality gates',
              `- npm ci: **${{ needs.quality.outputs.install }}**`,
              `- Production audit: **${{ needs.quality.outputs.audit }}**`,
              `- TypeScript: **${{ needs.quality.outputs.typecheck }}**`,
              `- Unit + coverage: **${{ needs.quality.outputs.coverage }}**`,
              `- Production build: **${{ needs.quality.outputs.build }}**`,
              '',
              '### Playwright gates',
              `- npm ci: **${{ needs.e2e.outputs.install }}**`,
              `- Chromium install: **${{ needs.e2e.outputs.browser }}**`,
              `- Desktop + mobile E2E: **${{ needs.e2e.outputs.playwright }}**`,
              '',
              `- Quality job: **${quality}**`,
              `- E2E job: **${e2e}**`,
              `- Commit: \`${context.sha}\``,
              '',
              ...details,
              ok ? 'הבראנץ׳ עבר את כל שערי האיכות.' : 'יש כשל ממוקד שדורש תיקון לפני מיזוג.'
            ].join('\n');
            const issueNumber = context.issue.number || 32;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const previous = comments.find(comment => comment.body?.includes('<!-- storefront-exhaustive-qa -->'));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
            }
