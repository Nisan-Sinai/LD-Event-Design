name: CI

on:
  push:
    branches: [main, redesign, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair_lock:
    name: Repair dependency lockfile
    if: github.event_name == 'pull_request' && github.head_ref == 'security/audit-hardening-2026-08-20' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair audited lockfile
        run: npm audit fix --package-lock-only
      - name: Verify all dependencies are clean
        run: npm audit
      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: bump vulnerable transitive dependencies"
          git push origin HEAD:${{ github.head_ref }}

  unit:
    name: Type-check · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
      - name: Audit all dependencies
        run: npm audit
      - run: npm run type-check
      - name: Unit tests with coverage
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee vitest.log
      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-diagnostics
          path: |
            vitest.log
            coverage
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
