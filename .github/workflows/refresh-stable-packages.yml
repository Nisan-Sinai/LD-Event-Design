name: Refresh Stable Packages

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: refresh-stable-packages-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Update every direct package to stable latest
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/update-all-stable-packages-2026-08-05'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the update branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply Tailwind 4 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('src/index.css')
          css = css_path.read_text(encoding='utf-8')
          old_header = '@tailwind base;\n@tailwind components;\n@tailwind utilities;'
          new_header = '@import "tailwindcss";\n@config "../tailwind.config.js";'
          if old_header in css:
              css = css.replace(old_header, new_header, 1)
          elif new_header not in css:
              raise SystemExit('Unexpected Tailwind CSS header; refusing an unsafe migration.')
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Install every direct dependency from the stable latest tag
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const run = (args) => {
            const result = spawnSync('npm', args, { stdio: 'inherit' });
            if (result.status !== 0) process.exit(result.status ?? 1);
          };

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const production = Object.keys(pkg.dependencies ?? {}).map((name) => `${name}@latest`);
          const development = Object.keys(pkg.devDependencies ?? {}).map((name) => `${name}@latest`);

          if (production.length > 0) run(['install', '--save', ...production]);
          if (development.length > 0) run(['install', '--save-dev', ...development]);
          NODE

      - name: Reject preview versions and verify npm latest tags
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const names = [...Object.keys(pkg.dependencies ?? {}), ...Object.keys(pkg.devDependencies ?? {})];
          const failures = [];

          for (const name of names) {
            const installed = JSON.parse(readFileSync(`node_modules/${name}/package.json`, 'utf8')).version;
            const latestRaw = execFileSync('npm', ['view', name, 'dist-tags.latest', '--json'], { encoding: 'utf8' }).trim();
            const latest = JSON.parse(latestRaw);

            if (installed.includes('-')) failures.push(`${name}: prerelease installed (${installed})`);
            if (installed !== latest) failures.push(`${name}: installed ${installed}, npm latest is ${latest}`);
          }

          if (failures.length > 0) {
            console.error(failures.join('\n'));
            process.exit(1);
          }

          console.log(`Verified ${names.length} direct packages on stable npm latest tags.`);
          NODE

      - name: Production security audit
        run: npm run audit:prod

      - name: TypeScript
        run: npm run type-check

      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:e2e

      - name: Commit the verified package files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/index.css

          if git diff --cached --quiet; then
            echo 'No package changes were required.'
            exit 0
          fi

          git commit -m 'chore(deps): update all packages to stable latest'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
