name: One-time Vitest Security Fix

on:
  push:
    branches:
      - fix/vitest-security-audit

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vitest-security-audit

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Upgrade Vitest security patch
        run: npm install --save-dev vitest@4.1.11 @vitest/coverage-v8@4.1.11

      - name: Verify full dependency audit
        run: npm audit --audit-level=low

      - name: Type-check
        run: npm run type-check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Commit security fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-vitest-security-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/one-time-vitest-security-fix.yml
          git commit -m "fix(deps): patch Vitest security vulnerability"
          git push origin HEAD:fix/vitest-security-audit
