name: Prepare React Router lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate updated lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify patched dependency versions
        run: |
          node --input-type=module -e "import lock from './package-lock.json' with { type: 'json' }; const rr = lock.packages['node_modules/react-router']?.version; const rrd = lock.packages['node_modules/react-router-dom']?.version; const react = lock.packages['node_modules/react']?.version; const reactDom = lock.packages['node_modules/react-dom']?.version; console.log({ reactRouter: rr, reactRouterDom: rrd, react, reactDom }); if (rr !== '8.3.0' || rrd !== '8.3.0' || !react?.startsWith('19.2.') || !reactDom?.startsWith('19.2.')) process.exit(1);"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-router-lockfile
          path: package-lock.json
          retention-days: 1
