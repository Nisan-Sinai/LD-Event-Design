name: Sync React Router lockfile

on:
  push:
    branches:
      - security/react-router-7-18-1

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[skip lock-sync]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/react-router-7-18-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify patched dependency tree
        run: |
          npm ls react-router react-router-dom
          npm audit --omit=dev --audit-level=moderate
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync React Router lockfile [skip lock-sync]"
          git push origin HEAD:security/react-router-7-18-1
