name: Prepare React Router lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate updated lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify patched dependency tree
        run: |
          npm ls react-router react-router-dom
          npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@v4
        with:
          name: react-router-lockfile
          path: package-lock.json
          retention-days: 1
