name: One-Time Branch Cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete all branches except main
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'chore/one-time-branch-cleanup-final'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              --jq '.[].name'
          )

          deleted=0
          failed=0

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi

            echo "Deleting branch: $branch"
            if gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              deleted=$((deleted + 1))
            else
              echo "::error::Failed to delete branch: $branch"
              failed=$((failed + 1))
            fi
          done

          echo "Deleted branches: $deleted"
          echo "Failed deletions: $failed"

          if (( failed > 0 )); then
            exit 1
          fi

      - name: Remove this completed one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          workflow_path='.github/workflows/one-time-branch-cleanup.yml'
          workflow_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=main" \
              --jq '.sha'
          )"

          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}" \
            -f message='chore: remove completed one-time branch cleanup' \
            -f sha="$workflow_sha" \
            -f branch='main'

          echo 'One-time cleanup workflow removed from main.'
